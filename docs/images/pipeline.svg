<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" role="img" aria-label="sr pipeline: discover, scan, confirm, write, record">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="writeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <style>
    .box { rx: 10; stroke-width: 1.5; }
    .title { font-weight: 700; font-size: 14px; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .phase { font-weight: 700; fill: #6b7280; font-size: 11px; letter-spacing: 1.2px; }
    .edge { stroke: #5b6472; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .cap { fill: #374151; font-size: 12px; }
  </style>

  <text x="24" y="34" class="phase">SR REPLACE — NOTHING IS WRITTEN UNTIL THE WHOLE TREE HAS BEEN SCANNED</text>

  <!-- phase bands -->
  <rect x="20" y="52" width="410" height="286" rx="12" fill="url(#scanGrad)" opacity="0.55"/>
  <rect x="452" y="52" width="428" height="286" rx="12" fill="url(#writeGrad)" opacity="0.6"/>
  <text x="36" y="74" class="phase">READ-ONLY PHASE</text>
  <text x="468" y="74" class="phase">MUTATING PHASE</text>

  <!-- left column -->
  <g>
    <rect class="box" x="46" y="92" width="358" height="52" fill="#ffffff" stroke="#93c5fd"/>
    <text x="62" y="114" class="title">1 · discover</text>
    <text x="62" y="132" class="sub">globs · --exclude · .gitignore · prune .git / node_modules / .sr</text>

    <rect class="box" x="46" y="160" width="358" height="52" fill="#ffffff" stroke="#93c5fd"/>
    <text x="62" y="182" class="title">2 · read + decode</text>
    <text x="62" y="200" class="sub">BOM · UTF-8 · --encoding · line endings · skip binary</text>

    <rect class="box" x="46" y="228" width="358" height="52" fill="#ffffff" stroke="#93c5fd"/>
    <text x="62" y="250" class="title">3 · match + diff</text>
    <text x="62" y="268" class="sub">one matcher: literal | regex | ERE | PCRE, ranges, counts</text>
  </g>

  <!-- confirm gate -->
  <g>
    <path d="M 225 296 L 320 320 L 225 344 L 130 320 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <text x="225" y="316" text-anchor="middle" class="title" fill="#9a3412">4 · confirm</text>
    <text x="225" y="333" text-anchor="middle" class="sub">exact numbers</text>
  </g>

  <!-- right column -->
  <g>
    <rect class="box" x="478" y="92" width="376" height="52" fill="#ffffff" stroke="#86efac"/>
    <text x="494" y="114" class="title">5 · atomic write</text>
    <text x="494" y="132" class="sub">temp + os.replace · mode/owner/mtime · --no-atomic keeps the inode</text>

    <rect class="box" x="478" y="160" width="376" height="52" fill="#ffffff" stroke="#86efac"/>
    <text x="494" y="182" class="title">6 · record</text>
    <text x="494" y="200" class="sub">journal.jsonl (fsync per file) + content-addressed blob</text>

    <rect class="box" x="478" y="228" width="376" height="52" fill="#ffffff" stroke="#86efac"/>
    <text x="494" y="250" class="title">7 · close + prune</text>
    <text x="494" y="268" class="sub">manifest.json · --keep / --keep-age retention</text>
  </g>

  <!-- edges -->
  <path class="edge" d="M 225 144 L 225 160"/>
  <path class="edge" d="M 225 212 L 225 228"/>
  <path class="edge" d="M 225 280 L 225 294"/>
  <path class="edge" d="M 320 320 C 420 320, 430 118, 476 118"/>
  <path class="edge" d="M 666 144 L 666 160"/>
  <path class="edge" d="M 666 212 L 666 228"/>

  <!-- abort path -->
  <path d="M 130 320 L 60 320 L 60 372" stroke="#ef4444" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="66" y="392" class="cap" fill="#b91c1c">Ctrl-C / “no” → nothing was written, no session, no mtime change</text>

  <!-- rollback path -->
  <path d="M 666 280 L 666 372 L 856 372" stroke="#0ea5e9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="676" y="392" class="cap" fill="#0369a1">sr rollback → drift-checked restore, itself journalled</text>
</svg>
